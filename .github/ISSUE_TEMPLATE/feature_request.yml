name: 功能建议
description: 提议新功能或改进现有行为
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到了什么问题，为什么需要这个功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望行为、界面或配置方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 是否考虑过其他实现方式？
  - type: checkboxes
    id: safety
    attributes:
      label: 范围确认
      options:
        - label: 此建议用于操作使用者自己的账号，不涉及批量滥用、绕过安全措施或攻击服务。
          required: true

