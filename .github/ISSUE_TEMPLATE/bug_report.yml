name: 错误报告
description: 报告可复现的程序错误
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除 QQ 号、pet_id、令牌、Cookie、签名、完整封包和其他隐私数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 发布版本号或 git commit 哈希
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、Python 版本、QQ/NapCat 版本
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - 源码运行
        - Windows 打包版
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 只粘贴与问题有关的片段；请再次确认敏感字段已经删除。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 我已删除账号、令牌、Cookie、签名、封包及其他隐私数据。
          required: true

